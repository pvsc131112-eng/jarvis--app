<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #050b14; color: #00f3ff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; overflow: hidden; }
        
        .header { text-align: center; margin-top: 10px; }
        .title { font-size: 1.5rem; letter-spacing: 4px; font-weight: 700; text-shadow: 0 0 10px #00f3ff; }
        .status { font-size: 0.8rem; color: #00f3ff88; margin-top: 5px; text-transform: uppercase; }

        .hud-container { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; width: 100%; height: 100%; }

        .output-box { width: 100%; max-height: 140px; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 10px; padding: 12px; overflow-y: auto; font-size: 0.9rem; text-align: center; color: #e0ffff; box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.1); }

        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; margin-bottom: 20px; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; background: transparent; border: 2px solid #00f3ff; color: #00f3ff; font-size: 2rem; cursor: pointer; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .mic-btn:active, .mic-btn.active { background: #00f3ff; color: #050b14; box-shadow: 0 0 30px #00f3ff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">J.A.R.V.I.S.</div>
        <div class="status" id="status-text">SISTEMA PRONTO</div>
    </div>

    <div class="hud-container">
        <canvas id="hudCanvas" width="300" height="300"></canvas>
    </div>

    <div class="output-box" id="output">Toque no microfone para iniciar a escuta...</div>

    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="alternarEscuta()">🎙️</button>
    </div>

    <script>
        // === SUAS CREDENCIAIS PRÉ-CONFIGURADAS ===
        const GEMINI_API_KEY = "AQ.Ab8RN6LHaI1EVQF9wds0LWQAngKzXoGQnTa3UiBdBCW_CuOU-w";
        const TELEGRAM_BOT_TOKEN = "8970049769:AAGs2qtKSiENfK-vYZeJqLaMpdUnAYAWgGU";
        const TELEGRAM_CHAT_ID = "8933113686";s

        // ESTADOS DA INTERFACE
        let ouvindo = false;
        let corHUD = "#00f3ff";
        const statusText = document.getElementById("status-text");
        const output = document.getElementById("output");
        const micBtn = document.getElementById("micBtn");

        // RECONHECIMENTO DE VOZ (NATIVO DO NAVEGADOR)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;

            recognition.onstart = () => {
                atualizarEstado("OUVINDO...", "#00ff66");
                micBtn.classList.add("active");
            };

            recognition.onresult = (event) => {
                const comando = event.results[0][0].transcript;
                output.innerText = `Você: "${comando}"`;
                processarComando(comando);
            };

            recognition.onerror = () => {
                atualizarEstado("ERRO AO OUVIR", "#ff0055");
                micBtn.classList.remove("active");
            };

            recognition.onend = () => {
                micBtn.classList.remove("active");
            };
        } else {
            output.innerText = "Reconhecimento de voz não suportado neste navegador.";
        }

        function alternarEscuta() {
            if (!recognition) return;
            if (ouvindo) {
                recognition.stop();
                ouvindo = false;
            } else {
                recognition.start();
                ouvindo = true;
            }
        }

        // LÓGICA DE PROCESSAMENTO GERAL
        async function processarComando(texto) {
            const textoLc = texto.toLowerCase();

            // 1. CAPTURAR FOTO, SALVAR NO DISPOSITIVO E ENVIAR AO TELEGRAM
            if (textoLc.includes("tirar foto") || textoLc.includes("capturar imagem") || textoLc.includes("tira foto")) {
                atualizarEstado("CAPTURANDO FOTO...", "#ffaa00");
                
                if (TELEGRAM_BOT_TOKEN === "SEU_TOKEN_TELEGRAM_AQUI" || TELEGRAM_CHAT_ID === "SEU_CHAT_ID_AQUI") {
                    falarEExibir("Por favor, preencha as credenciais do Telegram no código.");
                    return;
                }

                const fotoSucesso = await capturarESalvarEFotoTelegram();
                if (fotoSucesso) {
                    falarEExibir("Foto capturada, salva no dispositivo e enviada para o seu Telegram, senhor.");
                } else {
                    falarEExibir("Não foi possível capturar ou enviar a foto.");
                }
                return;
            }

            // 2. PESQUISAS NA WEB (Google)
            if (textoLc.includes("pesquisar por") || textoLc.includes("buscar no google")) {
                const termo = texto.replace(/pesquisar por|buscar no google/gi, "").trim();
                falarEExibir(`Pesquisando por ${termo} no Google.`);
                window.open(`https://www.google.com/search?q=${encodeURIComponent(termo)}`, '_blank');
                return;
            }

            // 3. ABRIR APLICATIVOS (Deep Links & URLs)
            if (textoLc.includes("abrir whatsapp")) {
                falarEExibir("Abrindo o WhatsApp.");
                window.location.href = "whatsapp://";
                return;
            }

            if (textoLc.includes("abrir youtube")) {
                falarEExibir("Abrindo o YouTube.");
                window.open("https://www.youtube.com", "_blank");
                return;
            }

            if (textoLc.includes("abrir mapas") || textoLc.includes("abrir gps")) {
                falarEExibir("Abrindo o Google Maps.");
                window.open("https://maps.google.com", "_blank");
                return;
            }

            // 4. ROTEAMENTO DE MENSAGEM DE TEXTO PARA TELEGRAM
            if (textoLc.includes("telegram") || textoLc.includes("enviar mensagem")) {
                atualizarEstado("ENVIANDO TELEGRAM...", "#ffaa00");
                
                if (TELEGRAM_BOT_TOKEN === "SEU_TOKEN_TELEGRAM_AQUI" || TELEGRAM_CHAT_ID === "SEU_CHAT_ID_AQUI") {
                    falarEExibir("Por favor, preencha as credenciais do Telegram no código.");
                    return;
                }

                const mensagemLimpa = texto.replace(/enviar no telegram|enviar mensagem no telegram|manda no telegram/gi, "").trim();
                const sucesso = await enviarTelegramTexto(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, mensagemLimpa || texto);
                
                if (sucesso) {
                    falarEExibir("Mensagem enviada com sucesso para o seu Telegram, senhor.");
                } else {
                    falarEExibir("Falha ao enviar a mensagem pelo Telegram.");
                }
                return;
            }

            // 5. ROTEAMENTO PARA GEMINI IA
            if (GEMINI_API_KEY === "SUA_CHAVE_GEMINI_AQUI") {
                falarEExibir("Por favor, insira a chave da API do Gemini no código.");
                return;
            }

            atualizarEstado("PROCESSANDO...", "#ffaa00");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Responda de forma curta e objetiva como o assistente JARVIS: ${texto}` }] }]
                    })
                });

                const data = await response.json();
                const respostaIA = data.candidates[0].content.parts[0].text;
                
                atualizarEstado("FALANDO...", "#00f3ff");
                falarEExibir(respostaIA);

            } catch (err) {
                atualizarEstado("ERRO NA API", "#ff0055");
                falarEExibir("Ocorreu um erro ao conectar com o servidor da IA.");
            }
        }

        // CAPTURA DA CÂMERA, SALVAMENTO LOCAL E ENVIO VIA TELEGRAM BOT (sendPhoto)
        async function capturarESalvarEFotoTelegram() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.createElement("video");
                video.srcObject = stream;
                await video.play();

                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = video.videoWidth || 640;
                tempCanvas.height = video.videoHeight || 480;
                const tempCtx = tempCanvas.getContext("2d");
                tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

                stream.getTracks().forEach(track => track.stop());

                // 1. Salva a foto no dispositivo local (Download Automático)
                const dataUrl = tempCanvas.toDataURL("image/jpeg");
                const a = document.createElement("a");
                a.href = dataUrl;
                a.download = `jarvis_foto_${Date.now()}.jpg`;
                a.click();

                // 2. Converte para Blob e envia via API sendPhoto do Telegram
                return new Promise((resolve) => {
                    tempCanvas.toBlob(async (blob) => {
                        if (!blob) {
                            resolve(false);
                            return;
                        }

                        atualizarEstado("ENVIANDO FOTO TELEGRAM...", "#ffaa00");
                        const enviou = await enviarTelegramFoto(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, blob);
                        resolve(enviou);
                    }, "image/jpeg", 0.90);
                });

            } catch (err) {
                console.error("Erro no acesso à câmera ou envio:", err);
                return false;
            }
        }

        // ENVIO DE FOTO PARA O TELEGRAM (API sendPhoto)
        async function enviarTelegramFoto(token, chatId, imageBlob) {
            try {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', imageBlob, 'jarvis_captura.jpg');
                formData.append('caption', '📸 *J.A.R.V.I.S. Mobile*: Foto capturada via assistente.');

                const url = `https://api.telegram.org/bot${token}/sendPhoto`;
                const res = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                return res.ok;
            } catch (e) {
                console.error("Erro no envio do Telegram:", e);
                return false;
            }
        }

        // ENVIO DE TEXTO PARA O TELEGRAM (API sendMessage)
        async function enviarTelegramTexto(token, chatId, mensagem) {
            try {
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: `🤖 *J.A.R.V.I.S. Mobile*:\n${mensagem}`, parse_mode: 'Markdown' })
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        // RESPOSTA POR VOZ (TEXT-TO-SPEECH)
        function falarEExibir(texto) {
            output.innerText = texto;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;
            utterance.onend = () => meAtualizarParaStandby();
            window.speechSynthesis.speak(utterance);
        }

        function atualizarEstado(msg, cor) {
            statusText.innerText = msg;
            statusText.style.color = cor;
            corHUD = cor;
        }

        function meAtualizarParaStandby() {
            atualizarEstado("SISTEMA PRONTO", "#00f3ff");
            ouvindo = false;
        }

        // RENDERIZAÇÃO GRÁFICA DA HUD (ARC REACTOR)
        const canvas = document.getElementById("hudCanvas");
        const ctx = canvas.getContext("2d");
        let angle = 0;

        function renderHUD() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Anel Externo
            ctx.beginPath();
            ctx.arc(cx, cy, 100, 0, Math.PI * 2);
            ctx.strokeStyle = corHUD;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = corHUD;
            ctx.stroke();

            // Anel Tracejado Rotativo
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.setLineDash([15, 10]);
            ctx.strokeStyle = corHUD;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();

            // Núcleo Central
            ctx.beginPath();
            ctx.arc(cx, cy, 35, 0, Math.PI * 2);
            ctx.fillStyle = corHUD;
            ctx.globalAlpha = 0.3;
            ctx.fill();
            ctx.globalAlpha = 1.0;

            angle += 0.02;
            requestAnimationFrame(renderHUD);
        }
        renderHUD();
    </script>
</body>
</html>
